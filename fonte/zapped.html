<title>Retrozap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: palco roxo de premiação, uma coluna de app (520px) centrada, cerimônia em 3 atos tipo Stories */
:root{
  --noite:#1A0B2E; --acai:#3D1A5C; --acai-2:#2A1242; --manga:#FFC23C; --chiclete:#FF4F8B;
  --goiaba:#FF7A59; --piscina:#2EC4F1; --uva:#A98BFF; --areia:#FFF4E0; --neblina:#B9A8CC; --linha:#4E2E6E;
  --modo:var(--chiclete); --raio:20px;
  --titulo:'Bricolage Grotesque', 'Arial Black', system-ui, sans-serif;
  --texto:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--noite);color:var(--areia)}
html{overflow-x:clip}
body{font-family:var(--texto);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;
  background-image:radial-gradient(circle at 50% -10%, rgba(255,194,60,.16), transparent 55%);background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--noite)}
.app{max-width:520px;margin:0 auto;padding-top:var(--toph,72px)}
html,body{overscroll-behavior-y:none}
html{scroll-padding-top:calc(var(--toph,72px) + 8px)}
h1,h2,h3{font-family:var(--titulo);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:3px solid var(--manga);outline-offset:3px}
.top{position:fixed;top:0;left:0;right:0;z-index:12;background:rgba(26,11,46,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,calc(50vw - 260px)) 12px;transform:translateZ(0);border-bottom:1px solid var(--linha);display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--titulo);font-weight:800;font-size:26px;color:var(--manga);letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px;background:none;border:0;padding:0}
.logo span{display:inline-block;transform:rotate(14deg) translateY(-2px);font-size:18px}
.steps{display:flex;gap:6px;flex:1;max-width:220px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--linha)}
.steps i.on{background:var(--manga)}
.screen{display:flex;flex-direction:column;gap:20px;padding-top:8px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--neblina)}
.hero h1{font-size:clamp(40px,11vw,60px)}
.hero h1 em{font-style:normal;color:var(--manga)}
.oque-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.oque-l li{display:flex;gap:12px;align-items:flex-start}
.oque-l .em{font-size:30px;line-height:1;flex:0 0 auto}
.oque-l b{display:block;font-family:var(--titulo);font-size:19px;color:var(--areia)}
.oque-l span:not(.em){display:block;font-size:15px;color:var(--neblina)}
.lead{color:var(--neblina);font-size:17px}
.btn{border:0;border-radius:999px;padding:16px 22px;font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-main{background:var(--manga);color:var(--noite)}
.btn-ghost{background:transparent;border:2px solid var(--linha);color:var(--areia)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row .btn{flex:1 1 200px}
.badge{display:flex;gap:10px;align-items:flex-start;background:var(--acai-2);border:1px solid var(--linha);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--neblina)}
.badge b{color:var(--areia)}
.panel{background:var(--acai);border-radius:var(--raio);padding:20px;display:flex;flex-direction:column;gap:14px}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:440px){.modes{grid-template-columns:repeat(2,1fr)}}
.mode{border:2px solid var(--linha);background:var(--acai-2);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14px}
.mode .em{font-size:28px;line-height:1}
.mode[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,var(--acai-2))}
.tabs{display:flex;gap:6px;background:var(--acai-2);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px;font-weight:700;font-size:14px;color:var(--neblina)}
.tabs button[aria-selected="true"]{background:var(--areia);color:var(--noite)}
ol.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-size:15px}
ol.how b{color:var(--manga)}
.drop{border:2px dashed var(--manga);border-radius:var(--raio);padding:22px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;background:rgba(255,194,60,.06)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.drop .big{font-size:40px}
.small{font-size:13px;color:var(--neblina)}
.err{color:var(--goiaba);font-size:14px}
.loader{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:80px;text-align:center}
.trofinho{font-size:84px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(-6deg)}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--acai);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .n{font-family:var(--titulo);font-weight:800;font-size:30px;color:var(--manga);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere;white-space:normal;max-width:100%}
.tile .l{font-size:13px;color:var(--neblina);overflow-wrap:anywhere}
.tile.wide{grid-column:1/-1}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:92px 1fr 56px;align-items:center;gap:8px;font-size:14px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:12px;border-radius:9px;background:var(--acai-2);overflow:hidden}
.bar .fl{height:100%;border-radius:9px;background:var(--neblina)}
.bar:first-child .fl{background:var(--manga)}
.bar .vl{text-align:right;font-variant-numeric:tabular-nums;color:var(--neblina)}
.hours{display:flex;align-items:flex-end;gap:2px;height:110px}
.hours div{flex:1;background:var(--neblina);border-radius:3px 3px 0 0;min-height:2px;opacity:.55}
.hours div.pk{background:var(--modo);opacity:1}
.haxis{display:flex;justify-content:space-between;font-size:11px;color:var(--neblina)}
.ad{border:1.5px dashed var(--linha);border-radius:14px;min-height:90px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--neblina);text-align:center;padding:12px}
.award{background:var(--acai);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:relative;overflow:hidden}
.award::before{content:"";position:absolute;inset:0 0 auto;height:6px;background:var(--modo)}
.award .em{font-size:96px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.award h2,.h-award{font-size:34px}
.award .crit{color:var(--neblina);font-size:15px;max-width:34ch}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.opt{border:2px solid var(--linha);background:var(--acai-2);border-radius:14px;padding:12px 8px;font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt.right{border-color:var(--manga);background:rgba(255,194,60,.2)}
.opt.wrong{border-color:var(--goiaba);opacity:.7}
.ask{font-weight:700;font-size:15px}
.reveal{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.selo{font-family:var(--titulo);font-weight:800;font-size:clamp(30px,9vw,44px);background:var(--manga);color:var(--noite);padding:8px 22px;border-radius:14px;transform:rotate(-4deg);box-shadow:6px 6px 0 var(--modo);animation:pop .5s cubic-bezier(.2,1.6,.4,1);margin:6px 0 22px;max-width:100%;text-align:center;overflow-wrap:anywhere}
@keyframes pop{from{transform:rotate(-4deg) scale(.3);opacity:0}}
.frase{font-size:17px;max-width:32ch;margin-top:4px}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%;min-height:200px;overflow:hidden}
.pod{flex:1;min-width:0;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transform:translateY(24px);transition:all .5s cubic-bezier(.2,1.3,.4,1)}
.pod.up{opacity:1;transform:none}
.pod .blk{width:100%;border-radius:12px 12px 4px 4px;background:var(--acai-2);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-family:var(--titulo);font-weight:800;font-size:22px;color:var(--neblina)}
.pod.p1 .blk{background:var(--manga);color:var(--noite)}
.pod .who{font-weight:700;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .v{font-size:12px;color:var(--neblina);font-variant-numeric:tabular-nums}
.scratch{position:relative;width:100%;max-width:320px;height:120px;border-radius:16px;overflow:hidden;background:var(--acai-2);display:flex;align-items:center;justify-content:center;touch-action:none}
.scratch .under{font-family:var(--titulo);font-weight:800;font-size:32px;color:var(--manga)}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.guess{width:100%;display:flex;flex-direction:column;gap:8px}
.guess output{font-family:var(--titulo);font-weight:800;font-size:40px;color:var(--manga);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--manga)}
.top3{width:100%;display:flex;flex-direction:column;gap:6px;font-size:14px;text-align:left;border-top:1px solid var(--linha);padding-top:12px}
.top3 div{display:flex;justify-content:space-between;gap:8px}
.top3 span:last-child{color:var(--neblina);font-variant-numeric:tabular-nums}
.nav{display:flex;gap:10px}
.nav .btn{flex:1}
.count{font-size:13px;color:var(--neblina);text-align:center}
.final .crown{font-size:80px;text-align:center;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--acai-2);border:1px solid var(--linha);border-radius:999px;padding:4px 10px;font-size:13px}
.person{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-top:1px solid var(--linha)}
.person:first-child{border-top:0;padding-top:0}
.person b{font-size:16px}
.lema{font-family:var(--titulo);font-weight:800;font-size:28px;text-align:center;color:var(--areia)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,4,20,.97);overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.badge.priv{border-color:var(--manga);background:rgba(255,194,60,.08)}
.modal img{max-width:min(86vw,420px);max-height:58vh;width:auto;height:auto;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.modal .btn-ghost{background:var(--acai-2)}
.modal p{text-align:center;max-width:32ch;font-size:14px;color:var(--neblina)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:15;width:100%;height:100%}
.sample{font-size:12px;font-weight:700;background:var(--modo);color:var(--noite);border-radius:999px;padding:3px 10px;align-self:flex-start}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;color:var(--areia);background:var(--acai-2);border:2px solid var(--linha);border-radius:12px;padding:12px 14px;width:100%}
.field input:focus{border-color:var(--manga);outline:none}
.emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.emojis button{font-size:26px;background:var(--acai-2);border:2px solid var(--linha);border-radius:12px;padding:6px 0;line-height:1.2}
.emojis button[aria-pressed="true"]{border-color:var(--manga);background:rgba(255,194,60,.2)}
.blur{filter:blur(7px);user-select:none}
.pix{background:var(--areia);color:var(--noite);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:320px}
.pix canvas{width:170px;height:170px;image-rendering:pixelated}
.pix .price{font-family:var(--titulo);font-weight:800;font-size:34px}
.pix .small{color:#5a4a6e}
.tag-premium{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--manga);color:var(--noite);border-radius:999px;padding:3px 10px}
.persona{display:flex;align-items:center;gap:14px;background:var(--acai);border-radius:var(--raio);padding:16px 18px}
.persona .em{font-size:56px;line-height:1}
.persona h1{font-size:clamp(28px,8vw,38px);color:var(--manga)}
.tale{display:flex;flex-direction:column;gap:16px}
.tale p{font-size:19px;line-height:1.6;max-width:62ch;animation:rise .6s ease-out both}
.tale p:first-child::first-letter{font-family:var(--titulo);font-weight:800;font-size:3.1em;float:left;line-height:.85;margin:6px 8px 0 0;color:var(--manga)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--acai);border-radius:14px;padding:10px 12px}
.cat .em{font-size:30px;text-align:center}
.cat .ct{display:flex;flex-direction:column;min-width:0}
.cat .st{font-size:12px;color:var(--neblina);text-align:right}
.cat.off{opacity:.5}
.cat.bon{opacity:.8}
.cat.extra{border:2px dashed var(--manga);background:transparent}
.field textarea{font:inherit;color:var(--areia);background:var(--acai-2);border:2px solid var(--linha);border-radius:12px;padding:12px 14px;width:100%;resize:vertical}
.field textarea:focus{border-color:var(--manga);outline:none}
.prontas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pronta{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--acai-2);border:2px solid var(--linha);border-radius:14px;padding:12px}
.pronta:hover{border-color:var(--manga)}
.pronta .em{font-size:28px;line-height:1.1}
.pronta b{font-size:15px}
.chip.ex{cursor:pointer;color:var(--areia);font-size:14px;padding:6px 12px}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:14px}
.rules>div{background:var(--acai-2);border:1px solid var(--linha);border-radius:14px;padding:12px}
.rules ul{margin:6px 0 0;padding-left:18px;color:var(--neblina);display:flex;flex-direction:column;gap:4px}
@media (max-width:420px){.rules{grid-template-columns:1fr}}
.mems{display:flex;flex-direction:column;gap:8px}
.mem{background:var(--acai);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.mem.off{opacity:.55}
.mem-top{display:flex;align-items:center;gap:10px;font-size:16px;cursor:pointer;overflow-wrap:anywhere}
.mem-top input{width:20px;height:20px;accent-color:var(--manga);flex:none}
.mem select{font:inherit;font-size:14px;color:var(--areia);background:var(--acai-2);border:1px solid var(--linha);border-radius:10px;padding:8px 10px;max-width:100%}
.chip.warn{border-color:var(--goiaba);color:var(--areia);font-size:12px}
.defs{background:var(--acai-2);border:1px solid var(--linha);border-radius:14px;padding:12px 14px}
.defs summary{cursor:pointer;font-weight:700}
.pdefs{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.pdef{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;font-size:14px;opacity:.75}
.pdef span[aria-hidden]{font-size:24px}
.pdef div{display:flex;flex-direction:column}
.pdef.on{opacity:1}.pdef.on b{color:var(--manga)}
.years{display:flex;align-items:flex-end;gap:6px;height:170px}
.yr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.yb{width:100%;max-width:44px;background:var(--neblina);opacity:.55;border-radius:6px 6px 0 0;min-height:3px}
.yr.rec .yb{background:var(--manga);opacity:1}
.yv{font-size:11px;color:var(--neblina);white-space:nowrap}
.yl{font-size:11px;color:var(--neblina)}
.persos{display:flex;flex-direction:column;gap:10px}
.perso{background:var(--acai);border-radius:var(--raio);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.perso .ph{display:flex;align-items:center;gap:12px}
.perso .em{font-size:40px;line-height:1}
.perso h3{font-size:24px;color:var(--manga)}
.perso ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.perso .fala{display:flex;flex-direction:column;gap:6px}
.perso .fala .rot{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.perso .chips{display:flex;flex-wrap:wrap;gap:6px}
.perso .chip{background:rgba(255,194,60,.16);color:var(--manga);font-weight:700;font-size:16px;border-radius:999px;padding:5px 12px}
.perso .chip.emo{font-size:20px;padding:3px 12px;letter-spacing:2px}
.resumo{font-size:15px;color:var(--neblina)}
.resumo b{color:var(--areia)}
.btn.mini{padding:9px 14px;font-size:14px;flex:0 1 auto}
.mem p{margin:0;font-size:15px}
.mem .hint{color:var(--areia)}
.mem.row{flex-direction:row;align-items:flex-start;gap:12px;cursor:pointer}
.mem.row input{width:20px;height:20px;accent-color:var(--manga);flex:none;margin-top:3px}
.mi{display:flex;flex-direction:column;gap:4px;min-width:0;overflow-wrap:anywhere}
.pbar{width:100%;max-width:320px;height:12px;border-radius:9px;background:var(--acai);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--manga);border-radius:9px;transition:width .2s}
.cd{font-family:var(--titulo);font-weight:800;font-size:28px;color:var(--manga);font-variant-numeric:tabular-nums}
.bio{font-size:16px;line-height:1.6}
.anchor{position:fixed;left:0;right:0;bottom:0;z-index:8;min-height:56px;padding:0 max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px));background:var(--acai-2);border-top:1.5px dashed var(--linha);display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--neblina)}
body.has-anchor{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.video{width:100%;aspect-ratio:16/9;max-width:100%;background:#0d0617;border:1px solid var(--linha);border-radius:16px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden}
.vtag{position:absolute;top:10px;left:12px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--neblina)}
.vnum{font-family:var(--titulo);font-weight:800;font-size:72px;color:var(--manga);font-variant-numeric:tabular-nums;line-height:1}
.vbar{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--acai)}
.vbar i{display:block;height:100%;width:0;background:var(--manga)}
.mem-line{display:flex;align-items:flex-start;gap:12px}
.mem-line input{width:20px;height:20px;accent-color:var(--manga);flex:none;margin-top:3px}
.mem-name{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0;overflow-wrap:anywhere;font-size:16px}

function tutorial(how){
  const id = ++TT_RUN, cenas = TT_CENAS[how], scr = $('#ttScr'), dedo = $('#ttDedo'), cap = $('#ttCap'), pp = $('#ttPP'), dn = $('#ttDeNovo');
  const lis = view.querySelectorAll('ol.how li');
  let i = 0, tocando = !TT_CALMO(), tm = null;
  const vivo = () => id === TT_RUN && scr.isConnected;
  const espera = ms => new Promise(r => { tm = setTimeout(r, ms); });
  const pinta = c => {
    scr.innerHTML = casalTxt(c.h); cap.textContent = casalTxt(c.cap);
    lis.forEach((li, k) => li.classList.toggle('on', k === c.p));
    dedo.classList.remove('tap');

  };
  const botao = () => { pp.textContent = tocando ? '⏸ Pausar animação' : '▶ Ver animação'; pp.setAttribute('aria-pressed', String(!tocando)); };

    while (vivo() && tocando){
      const c = cenas[i];

        await espera(c.w || 1100); if (!vivo() || !tocando) return;
        { const a = scr.querySelector('.alvo'), ph = scr.parentNode.getBoundingClientRect();

  dn.onclick = () => { clearTimeout(tm); i = 0; pinta(cenas[0]); dedo.style.left = '50%'; dedo.style.top = '92%'; tocando = true; botao(); tm = setTimeout(() => { if (vivo() && tocando) ciclo(); }, 800); };

// duração de cada áudio .opus do zip (só exports "com mídia"): lê a última página Ogg do arquivo
async function duracoes(zip){
  const out = {}, lista = Object.values(zip.files).filter(z => /\.(?:opus|ogg)$/i.test(z.name)).slice(0, 5000);
  for (const z of lista){
    try {
      const b = await z.async('uint8array');
      for (let i = b.length - 27; i >= 0; i--){
        if (b[i]===0x4F && b[i+1]===0x67 && b[i+2]===0x67 && b[i+3]===0x53){
          let g = 0; for (let j = 7; j >= 0; j--) g = g*256 + b[i+6+j];
          if (g > 0 && g < 48000*3600) out[z.name.split('/').pop()] = g/48000; break;
        }
      }
    } catch {}
  }
  return out;
}
// nome do grupo pelo nome do arquivo do export ("Conversa do WhatsApp com X", "WhatsApp Chat - X")
// corta em até n caracteres sem partir emoji/bandeira ao meio
function cortaNome(s, n = 40){
  s = String(s || '');
  let gs; try { gs = [...new Intl.Segmenter('pt-BR', {granularity: 'grapheme'}).segment(s)].map(x => x.segment); } catch { gs = [...s]; }
  const out = []; let len = 0;
  for (const g of gs){ if (len + g.length > n) break; out.push(g); len += g.length; }
  // tira bandeira pela metade (uma letra regional sozinha)
  while (out.length && /^[\u{1F1E6}-\u{1F1FF}]$/u.test(out[out.length - 1])) out.pop();
  return out.join('').trim();
}
function nomeDoArquivo(nome){
  const n = limpaTxt(String(nome || '').split('/').pop()).replace(/\.(zip|txt)$/i, '').trim();
  const m = n.match(/^(?:Conversa do WhatsApp com|Conversa do WhatsApp -|WhatsApp Chat with|WhatsApp Chat -|Chat de WhatsApp con|Chat de WhatsApp -)\s*(.+)$/i);
  return m ? cortaNome(limpaTxt(m[1])) : '';
}
// ou pelo último "mudou o nome do grupo para ..." / "criou o grupo ..."
function nomeDaConversa(text){
  const rx = /(?:mudou o nome(?: do grupo)?(?: de [“"][^”"]*[”"])? para|mudou o assunto(?: de [“"][^”"]*[”"])? para|criou (?:o )?grupo|changed the (?:group name|subject)(?: from [“"][^”"]*[”"])? to|created group) [“"]([^”"\n]{1,40})[”"]/gi;
  let m, ult = ''; while ((m = rx.exec(text))) ult = limpaTxt(m[1]); return ult;
}
async function readFile(f){
  DUR = {}; state.grupo = nomeDoArquivo(f.name);
  const err = $('#err');
  try{
    let text;
    let buf = state.arquivo === f && state.bytes;
    if (!buf){
      try { buf = await f.arrayBuffer(); }
      catch { throw new Error('O celular não deixou o site abrir esse arquivo. Escolha o arquivo de novo (de preferência salvo em Downloads) e toque em Fazer a retrospectiva.'); }
    }
    const u8 = new Uint8Array(buf);
    // zip pelo conteúdo (PK), não pelo nome: no Android o nome às vezes chega sem extensão
    if (u8[0] === 0x50 && u8[1] === 0x4B){
      const zip = await JSZip.loadAsync(buf);
      const txts = Object.values(zip.files).filter(z => !z.dir && /\.txt$/i.test(z.name) && !/(^|\/)__MACOSX\//.test(z.name));
      const entry = txts.find(z => /^(?:.*\/)?(?:_chat|Conversa do WhatsApp|WhatsApp Chat|Chat de WhatsApp)/i.test(z.name)) || txts.sort((a, b) => (b._data?.uncompressedSize || 0) - (a._data?.uncompressedSize || 0))[0];
      if (!entry) throw new Error('Não achei a conversa dentro do .zip. Exporte de novo escolhendo "Sem mídia".');
      text = await entry.async('string');
      if (!state.grupo) state.grupo = nomeDoArquivo(entry.name);
      DUR = await duracoes(zip);
    } else {
      // texto: UTF-8 (com ou sem BOM) ou UTF-16, que alguns Androids geram
      const bom16 = (u8[0] === 0xFF && u8[1] === 0xFE) || (u8[0] === 0xFE && u8[1] === 0xFF);
      text = new TextDecoder(bom16 ? (u8[0] === 0xFF ? 'utf-16le' : 'utf-16be') : 'utf-8').decode(u8);
    }
    text = text.replace(/^\uFEFF/, '');
    run(text, false);
  }catch(e){ err.hidden = false; err.textContent = e.message || 'Não consegui abrir esse arquivo. Tente exportar de novo.'; }
}

// Sugere quem é um número desconhecido: alguém que começou a falar quando o número parou,
// que quase não falava ao mesmo tempo que ele e que escreve parecido (horários, palavras, emojis).
function sugerir(x, pessoas, raw){
  const ate = (ts, v) => { let lo = 0, hi = ts.length; while (lo < hi){ const md = (lo + hi) >> 1; if (ts[md] <= v) lo = md + 1; else hi = md; } return lo; }; // quantos horários ≤ v
  const cos = (a, b) => { let s = 0, na = 0, nb = 0; for (let i = 0; i < a.length; i++){ s += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; } return na && nb ? s / Math.sqrt(na*nb) : 0; };
  const topo = v => new Set(Object.entries(v).sort((a,b) => b[1]-a[1]).slice(0, 25).map(e => e[0]));
  const tx = topo(x.voc), trocas = (raw.sys || []).filter(e => e.type === 'numero');
  let melhor = null;
  for (const p of pessoas){
    const junto = (ate(p.ts, +x.last) - ate(p.ts, +x.first - 1)) / p.c;
    if (junto > .25) continue; // falavam ao mesmo tempo: provavelmente pessoas diferentes
    const tp = topo(p.voc), comuns = [...tx].filter(w => tp.has(w)).length;
    const estilo = .5*cos(x.h, p.h) + .5*(comuns / Math.max(1, Math.min(tx.size, tp.size)));
    const passou = p.first >= new Date(+x.last - 60*864e5);
    const aviso = trocas.some(e => e.who === p.n && Math.abs(e.t - x.last) < 90*864e5);
    const score = (1 - junto)*.3 + estilo*.4 + (passou ? .2 : 0) + (aviso ? .4 : 0);
    const motivos = [];
    if (aviso) motivos.push(`${p.n} avisou que trocou de número nessa época`);
    if (passou) motivos.push(`começou a falar quando este número parou`);
    if (estilo > .45) motivos.push('escreve parecido');
    if (!melhor || score > melhor.score) melhor = {nome:p.n, score, motivos};
  }
  return melhor && melhor.score >= .55 && melhor.motivos.length ? melhor : null;
}

function classificar(d, m){

  const night = sum('night')/tot, laugh = sum('laugh')/texts, stick = sum('sticker')/tot, audio = sum('audio')/tot, after = sum('after')/tot;
  if (m === 'casal'){ const dias = Math.max(1, (d.end - d.start)/864e5); return tot/dias > 40 ? 'Casal Grudento' : night > .12 ? 'Casal Coruja' : laugh > .2 ? 'Casal Meme' : audio > .05 ? 'Casal Podcast' : sum('teamo')/texts > .03 ? 'Casal Romântico' : 'Casal Equilibrado'; }

  if (m === 'comunidade') return sum('vende') > sum('aviso') && sum('vende') > 5 ? 'Feirinha do Bairro' : sum('aviso') > 5 ? 'Central de Avisos' : 'Comunidade Ativa';

}

// o momento mais marcante de 2026: o dia em que o grupo "parou" (volume acima do normal, gente falando, risadas, fotos)
const ANO_MOMENTO = 2026;
const TEMAS_MOMENTO = [
  ['luto', null, /faleceu|falecimento|morreu|velorio|sepultamento|luto|meus sentimentos|descanse em paz/],
  ['bebe', ['👶', 'chegada de um bebê'], /nasceu|bebe|gravida|gravidez|maternidade|parto|cha de bebe/],
  ['casamento', ['💍', 'casamento à vista'], /casamento|casou|casar|noiv|alianca|pedido de casamento/],
  ['aniversario', ['🎂', 'aniversário'], /parabens|feliz aniversario|niver|muitos anos de vida|felicidades/],
  ['jogo', ['⚽', 'dia de jogo'], /\bgo+l+\b|campeao|titulo|jogo|partida|classificou|final do|juiz|penalti/],
  ['viagem', ['✈️', 'viagem ou rolê'], /viagem|aeroporto|praia|chegamos|voo|hotel|role|festa|show/],
  ['noticia', ['📰', 'notícia que agitou todo mundo'], /noticia|viu isso|urgente|saiu agora|ta sabendo|olha isso/]
];
function momentoMarcante(d){
  if (d._momento !== undefined) return d._momento;
  const norm = x => x.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '');
  const dias = {};
  for (const m of d.msgs){
    if (m.t.getFullYear() !== ANO_MOMENTO) continue;
    const k = m.t.getFullYear() + '-' + String(m.t.getMonth()+1).padStart(2,'0') + '-' + String(m.t.getDate()).padStart(2,'0');
    const x = dias[k] || (dias[k] = {k, t: m.t, n: 0, risos: 0, midia: 0, quem: {}, emo: {}, tema: {}});
    x.n++; x.quem[m.a] = (x.quem[m.a] || 0) + 1;
    const tipo = kind(m.b);
    if (tipo === 'photo' || tipo === 'media') x.midia++;
    if (tipo !== 'text') continue;
    if (RX.laugh.test(m.b)) x.risos++;
    for (const e of m.b.match(/\p{Extended_Pictographic}/gu) || []) x.emo[e] = (x.emo[e] || 0) + 1;
    const b = norm(m.b);
    for (const [k2, , rx] of TEMAS_MOMENTO) if (rx.test(b)) x.tema[k2] = (x.tema[k2] || 0) + 1;
  }
  const lista = Object.values(dias);
  if (lista.length < 10) return (d._momento = null); // pouca conversa em 2026 para comparar
  const ns = lista.map(x => x.n).sort((a,b) => a - b), normal = Math.max(1, ns[Math.floor(ns.length/2)]);
  const pessoas = Math.max(2, d.people.length);
  const cands = [];
  for (const x of lista){
    if ((x.tema.luto || 0) >= 2) continue; // dia triste não vira "momento marcante"
    const falaram = Object.keys(x.quem).length, vezes = x.n / normal;
    if (x.n < 20 || vezes < 2.5) continue;
    cands.push({...x, vezes, falaram, score: vezes * (0.6 + falaram/pessoas) + x.risos/Math.max(10, x.n) * 3 + Math.min(x.midia, 30)/10});
  }
  const monta = melhor => {
    const temaTop = Object.entries(melhor.tema).filter(([k]) => k !== 'luto').sort((a,b) => b[1] - a[1])[0];
    let tema = temaTop && temaTop[1] >= 3 ? TEMAS_MOMENTO.find(t => t[0] === temaTop[0])[1] : null;
    if (!tema) tema = melhor.risos / melhor.n > .2 ? ['😂', 'zoeira pura'] : melhor.midia >= 10 ? ['📸', 'chuva de fotos'] : ['💬', 'conversa que não acabava'];
    const quem = Object.entries(melhor.quem).sort((a,b) => b[1] - a[1])[0][0];
    const emoji = Object.entries(melhor.emo).sort((a,b) => b[1] - a[1])[0]?.[0] || '';
    const data = melhor.t.toLocaleDateString('pt-BR', {day: 'numeric', month: 'long'});
    return {data, n: melhor.n, vezes: Math.round(melhor.vezes), falaram: melhor.falaram, risos: melhor.risos, midia: melhor.midia, tema, quem, emoji};
  };
  d._momentos = cands.sort((a,b) => b.score - a.score).slice(0, 3).map(monta);
  return (d._momento = d._momentos[0] || null);
}

/* ---------- comparação com outros grupos (só números anônimos; no site com servidor) ---------- */
async function comparar(d){
  state.comp = null;
  if (state.comparar === false) return;
  // grupo de exemplo: comparação simulada, e nada é enviado ao banco
  if (state.sample){ state.comp = {pronto:true, n:1000, exemplo:true, top:{risadas:3, palavrao:2, furos:4, por_dia:6, madrugada:7, recorde:9, audios:12, total:4, figurinhas:38, textao:60, apagadas:41, dias:30, bomdia:70, parabens:55, fora:80}}; return; }
  try {
    const base = `${+d.start}|${d.total}|${d.people.length}|${state.modo}`;
    const h = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(base)))].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
    const r = await fetch('/api/stats', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({id: h, modo: state.modo, ...numerosDoGrupo(d)})});
    const j = await r.json(); if (j && j.pronto) state.comp = j;
  } catch {}
}

// Destaques de 2026 (Premium): comparações com 2025, revelação, sumiço, dupla, top momentos, palavra do ano
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function destaques2026(d){
  if (d._d26) return d._d26;
  const A = ANO_MOMENTO, B = A - 1, casal = state.modo === 'casal', itens = [];
  const m26 = d.msgs.filter(m => m.t.getFullYear() === A);
  if (m26.length < 50) return (d._d26 = itens);
  const pct = x => `${Math.round(x*100)}%`;
  // 2026 x 2025, até a mesma data
  const ult = m26.reduce((a, m) => m.t > a ? m.t : a, m26[0].t), lim = new Date(B, ult.getMonth(), ult.getDate(), 23, 59);
  const m25 = d.msgs.filter(m => m.t.getFullYear() === B), n25 = m25.filter(m => m.t <= lim).length;
  if (n25 >= 50){ const v = Math.round((m26.length/n25 - 1)*100), sujeito = casal ? 'Vocês falaram' : 'O grupo falou';
    itens.push({e:'📊', t:'2026 x 2025', big: v >= 0 ? `+${v}%` : `${v}%`, sub: `${sujeito} ${Math.abs(v)}% ${v >= 0 ? 'a mais' : 'a menos'} que em 2025 (até ${ult.getDate()} de ${MESES[ult.getMonth()]})`}); }
  if (!casal && d.people.length >= 3){
    if (m25.length >= 100){
      const s = d.people.map(p => ({n: p.name, a: (p.y[A]||0)/m26.length, b: (p.y[B]||0)/m25.length, c: p.y[A]||0}));
      const rev = s.filter(x => x.c >= 20).sort((x,y) => (y.a - y.b) - (x.a - x.b))[0];
      if (rev && rev.a - rev.b > .02) itens.push({e:'🚀', t:'Revelação de 2026', big: rev.n, sub: `de ${pct(rev.b)} para ${pct(rev.a)} das mensagens do grupo`});
      const sum = s.filter(x => x.b >= .05).sort((x,y) => (x.a - x.b) - (y.a - y.b))[0];
      if (sum && sum.b - sum.a > .02) itens.push({e:'👻', t:'Sumiço do ano', big: sum.n, sub: `de ${pct(sum.b)} para ${pct(sum.a)} das mensagens. Cadê você?`});
    }
    const par = {}; for (let i = 1; i < m26.length; i++){ const a = m26[i-1], b2 = m26[i]; if (a.a !== b2.a && b2.t - a.t < 30*60e3){ const k = [a.a, b2.a].sort().join(' & '); par[k] = (par[k]||0) + 1; } }
    const dupla = Object.entries(par).sort((x,y) => y[1] - x[1])[0];
    if (dupla) itens.push({e:'🤝', t:'Dupla do ano', big: dupla[0], sub: `${fmt(dupla[1])} trocas de mensagem em 2026`});
  }
  if (casal){
    const fd = {}; let ult2 = ''; for (const m of m26){ const k = m.t.toDateString(); if (k !== ult2){ fd[m.a] = (fd[m.a]||0) + 1; ult2 = k; } }
    const pux = Object.entries(fd).sort((x,y) => y[1] - x[1])[0];
    if (pux) itens.push({e:'☀️', t:'Quem puxou mais papo', big: pux[0], sub: `abriu a conversa em ${fmt(pux[1])} dias de 2026`});
    const am = Array(12).fill(0); for (const m of m26) if (RX.teamo.test(m.b)) am[m.t.getMonth()]++;
    const mx = Math.max(...am); if (mx >= 3) itens.push({e:'💘', t:'Mês mais apaixonado', big: MESES[am.indexOf(mx)], sub: `${fmt(mx)} declarações de amor`});
  }
  momentoMarcante(d); const mom = d._momentos || [];
  if (mom.length) itens.push({e:'🌟', t:`Top ${mom.length} momento${mom.length > 1 ? 's' : ''} de 2026`, big: mom.map(x => x.data).join(' · '), sub: mom.map(x => `${x.tema[0]} ${x.tema[1]}`).join(' · ')});
  // palavra de 2026: a que mais cresceu em relação aos anos anteriores
  const conta = (lista) => { const o = {}; let t = 0; for (const m of lista){ if (kind(m.b) !== 'text' || RX.laugh.test(m.b)) continue;
    const sl = m.b.toLowerCase().replace(/(?:https?:\/\/|www\.)\S+|\S+\.(?:com|br|net|org)\b\S*/g, ' ');
    for (const w of sl.normalize('NFC').match(/\p{L}{4,}/gu) || []) if (!STOP.has(w)){ o[w] = (o[w]||0) + 1; t++; } } return [o, Math.max(1, t)]; };
  const [w26, t26] = conta(m26), [wAnt, tAnt] = conta(d.msgs.filter(m => m.t.getFullYear() < A));
  const pal = Object.entries(w26).filter(([, n]) => n >= 8).map(([w, n]) => [w, n, (n/t26) / (((wAnt[w]||0) + 1)/tAnt)]).sort((x,y) => y[2] - x[2])[0];
  if (pal) itens.push({e:'🗣️', t:'Palavra de 2026', big: `“${pal[0]}”`, sub: `${fmt(pal[1])} vezes em 2026${tAnt > 500 ? `, ${Math.max(2, Math.round(pal[2]))}× mais que antes` : ''}`});
  const meses = Array(12).fill(0); for (const m of m26) meses[m.t.getMonth()]++;
  const mi = meses.indexOf(Math.max(...meses)); itens.push({e:'📈', t:'Mês mais agitado', big: MESES[mi], sub: `${fmt(meses[mi])} mensagens`});
  const ag = itens.pop(); itens.splice(Math.min(1, itens.length), 0, ag);
  return (d._d26 = itens.slice(0, 7));
}

// card do casal: quem manda mais o quê (sem rótulo de gênero, só os nomes)
function categoriasCasal(d){
  const [a, b] = d.people;
  const L = [['💬','Mensagens','count'],['💘','Declarações de amor','teamo'],['❤️','Corações e beijinhos','coracao'],['😂','Risadas','laugh'],['🎙️','Áudios','audio'],['🖼️','Figurinhas','sticker'],['📸','Fotos e vídeos','photo'],['☀️','Bom dia','bomdia'],['🥺','Saudade','saudade'],['🙏','Pedidos de desculpa','desculpa'],['🍕','Falou de comida','fome'],['🌅','Puxou o papo do dia','first']];
  const [msg, ...resto] = L.map(([e, t, k]) => ({e, t, a: a[k]||0, b: b[k]||0})).filter((x, i) => i === 0 || x.a + x.b >= 5);
  return {msg, cats: resto.sort((x, y) => (y.a + y.b) - (x.a + x.b)).slice(0, 6)};
}

function wrap(c, text, x, y, maxW, lh){
  const words = text.split(' '); let line = '', lines = [];
  for (const w of words){ const t = line ? line+' '+w : w; if (c.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }

async function mandarWhats(blob, nome, texto, msg, semNada){
  const f = new File([blob], nome, {type:'image/png'});

  if (pode){
    try { await navigator.share({files:[f], text:texto}); return 'ok'; }
    catch (e){ if (e?.name === 'AbortError') return 'cancelado'; }
  }
  if (semNada) return semNada();
  let copiou = false;
  try { await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); copiou = true; } catch {}
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank', 'noopener');
  if (msg) msg.textContent = copiou ? 'Abrimos o WhatsApp com o convite escrito. Escolha a conversa e cole a imagem (Ctrl+V ou Cmd+V).' : 'Abrimos o WhatsApp com o convite escrito. Salve a imagem e anexe na conversa.';

    const body = p.m && rnd() < .35 ? p.m[Math.floor(rnd()*p.m.length)] : p.t[Math.floor(rnd()*p.t.length)];
    const nome = p.n === 'Rafa' && day < 520 ? '+55 11 98877-1234' : p.n;
    out.push({t, line:`${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())} - ${nome}: ${body}`});
  }
  // um dia de festa em 2026 para o "momento mais marcante" aparecer no exemplo
  { const festa = ['PARABÉNS PEDRÃO!!! 🎂🎉','Parabéns meu amigo!! 🥳','kkkkkk o bolo caiu','Feliz aniversário!! Muitos anos de vida 🎉','Manda foto do bolo','<Mídia oculta>','kkkkkkkk não acredito','Parabéns!!! 🎂','Que dia hein','Bora comemorar hoje!','<Mídia oculta>','Felicidades, Pedrão!! 🥂'];
    const quem = ['Lu','Caio','Bia','Rafa','Juninho','Pedrão'];
    for (let i = 0; i < 70; i++){ const t = new Date(2026,2,14,9 + Math.floor(i/6), (i*7) % 60); const nome = quem[i % quem.length], body = festa[i % festa.length];
      out.push({t, line:`${pad(t.getDate())}/${pad(t.getMonth()+1)}/${t.getFullYear()} ${pad(t.getHours())}:${pad(t.getMinutes())} - ${nome}: ${body}`}); } }
  out.push({t:new Date(2025,2,16,10,0), line:'16/03/2025 10:00 - Tiago saiu'});
  out.push({t:new Date(2025,5,4,9,0), line:'04/06/2025 09:00 - Rafa mudou para um novo número. Toque para enviar uma mensagem ou adicionar o novo número.'});
  out.sort((a,b) => a.t-b.t);
  return '01/01/2024 08:00 - As mensagens e as ligações são protegidas com a criptografia de ponta a ponta.\n' + out.map(o=>o.line).join('\n');
}
